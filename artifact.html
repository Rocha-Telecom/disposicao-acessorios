<title>Disposição de Acessórios</title>

    justify-content: space-between;

    flex-wrap: wrap;

    display: inline-flex;
    align-items: center;
    gap: 9px;

  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }

    height: 22px;

  .note {

    color: var(--ink-2);

  .url-field {

    flex-direction: column;
    gap: 6px;
    margin: 16px 0 22px;

  .url-field label {

    text-transform: uppercase;

  .url-field input {
    font-family: var(--font-mono);
    font-size: .8125rem;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);

  .qr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .qr-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: #FFFFFF;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 16px 14px 14px;
    text-align: center;
  }
  .qr-card svg { width: 100%; height: auto; max-width: 190px; display: block; }
  .qr-title {
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .02em;
    color: #101519;
  }
  .qr-sub {
    font-size: .6875rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #5A6470;
    font-weight: 600;
  }
  .qr-note { font-size: .6875rem; color: #5A6470; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- impressao: folha de QR para colar nos armarios ---------- */
  @media print {
    body { background: #fff; color: #000; }
    .topbar, .no-print { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .qr-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10mm;
    }
    .qr-card {
      break-inside: avoid;
      border: 1px dashed #999;
      padding: 8mm 6mm;
    }
    .qr-card svg { max-width: 55mm; }
  }
</style>

<script>
/* Gerador de QR Code (modo byte, nivel de correcao M, versoes 1-10).
   Implementacao propria, sem dependencias externas. Retorna SVG. */
var QR = (function () {
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();

  function mul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function rsGen(n) {
    var p = [1];
    for (var i = 0; i < n; i++) {
      var np = new Array(p.length + 1);
      for (var k = 0; k < np.length; k++) np[k] = 0;
      for (var j = 0; j < p.length; j++) {
        np[j] ^= p[j];
        np[j + 1] ^= mul(p[j], EXP[i]);
      }
      p = np;
    }
    return p;
  }

  function rsRemainder(data, ecLen) {
    var gen = rsGen(ecLen);
    var buf = new Uint8Array(data.length + ecLen);
    buf.set(data);
    for (var i = 0; i < data.length; i++) {
      var c = buf[i];
      if (c !== 0) for (var j = 0; j < gen.length; j++) buf[i + j] ^= mul(gen[j], c);
    }
    return buf.subarray(data.length);
  }

  // [totalCodewords, ecPorBloco, g1Blocos, g1Dados, g2Blocos, g2Dados] - nivel M
  var SPEC = {
    1:  [26,  10, 1, 16, 0, 0],
    2:  [44,  16, 1, 28, 0, 0],
    3:  [70,  26, 1, 44, 0, 0],
    4:  [100, 18, 2, 32, 0, 0],
    5:  [134, 24, 2, 43, 0, 0],
    6:  [172, 16, 4, 27, 0, 0],
    7:  [196, 18, 4, 31, 0, 0],
    8:  [242, 22, 2, 38, 2, 39],
    9:  [292, 22, 3, 36, 2, 37],
    10: [346, 26, 4, 43, 1, 44]
  };
  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
  };

  function dataCapacity(v) {
    var s = SPEC[v];
    var cw = s[2] * s[3] + s[4] * s[5];
    var overhead = 4 + (v < 10 ? 8 : 16);
    return Math.floor((cw * 8 - overhead) / 8);
  }

  function utf8Bytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var c2 = str.charCodeAt(++i);
        var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return out;
  }

  function bch(value, poly, bits) {
    var v = value << (bits - 1);
    var polyBits = 0, t = poly;
    while (t) { polyBits++; t >>= 1; }
    while (true) {
      var vb = 0, u = v;
      while (u) { vb++; u >>= 1; }
      if (vb < polyBits) break;
      v ^= poly << (vb - polyBits);
    }
    return (value << (bits - 1)) | v;
  }

  function maskFn(mask, r, c) {
    switch (mask) {
      case 0: return (r + c) % 2 === 0;
      case 1: return r % 2 === 0;
      case 2: return c % 3 === 0;
      case 3: return (r + c) % 3 === 0;
      case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
      case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
      case 6: return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0;

function todosItens() {
  var out = [];
  DADOS.armarios.forEach(function (a) {
    a.itens.forEach(function (it) {
      out.push({ arm: a.n, it: it });
    });
  });
  return out;
}

var RE_ACENTOS = new RegExp('[\\u0300-\\u036f]', 'g');
function normaliza(s) {
  return String(s).toLowerCase().normalize('NFD').replace(RE_ACENTOS, '');
}

function filtra(lista, termo) {
  var t = normaliza(termo).split(/\s+/).filter(Boolean);
  if (!t.length) return lista;
  return lista.filter(function (row) {
    var it = row.it || row;
    var alvo = normaliza(it.desc + ' ' + it.ref);
    return t.every(function (p) { return alvo.indexOf(p) !== -1; });
  });
}

/* ---------------- telas ---------------- */
function viewHome(termo) {
  var totalRefs = DADOS.resumo.refs;
  var h = '';

  h += '<div class="search no-print">' +
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>' +
    '<input id="q" type="search" placeholder="Buscar acessório ou código" value="' + esc(termo || '') + '" autocomplete="off">' +
    (termo ? '<button class="search-clear" id="qclear" aria-label="Limpar busca">&times;</button>' : '') +
    '</div>';

  if (termo) {
    var achados = filtra(todosItens(), termo);
    h += '<div class="section-label"><span>Resultados</span><span class="count">' + achados.length + '</span></div>';
    if (!achados.length) {
      h += '<div class="empty">Nenhum acessório encontrado para <b>' + esc(termo) + '</b>.</div>';
    } else {
      h += '<div class="items">';
      achados.forEach(function (row) {
        var it = row.it;
        h += '<div class="item">' +
          '<div class="item-qtd">' + nf(it.qtd) + '<small>un</small></div>' +
          '<div>' +
            '<div class="item-desc">' + esc(it.desc) + '</div>' +
            '<div class="item-meta">' +
              '<span class="where">Armário <b>' + row.arm + '</b> · Prateleira <b>' + it.prat + '</b></span>' +
              '<span class="ref">' + esc(it.ref) + '</span>' +
              pill(it.status) +
            '</div>' +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    }
    return h;
  }

  h += '<div class="section-label"><span>Armários</span><span class="count">' +
       nf(DADOS.resumo.fisico) + ' peças</span></div>';
  h += '<div class="cab-grid">';
  DADOS.armarios.forEach(function (a) {
    var pecas = totalPecas(a);
    var vazio = a.itens.length === 0;
    h += '<a class="cab' + (vazio ? ' vazio' : '') + '" href="#/arm/' + a.n + '">' +
      '<div class="cab-n"><span>Armário</span><b>' + a.n + '</b></div>' +
      '<div class="cab-qtd">' + (vazio ? '—' : nf(pecas)) + '</div>' +
      '<div class="cab-sub">' + (vazio ? 'sem itens' : nf(pecas) + ' ' + plural(pecas, 'peça', 'peças') + ' · ' + a.itens.length + ' ' + plural(a.itens.length, 'ref', 'refs')) + '</div>' +
      '</a>';
  });
  h += '</div>';

  h += '<div class="section-label"><span>Conferência geral</span></div>';
  h += '<dl class="stats">' +
    '<div class="stat"><dt>Referências</dt><dd>' + nf(totalRefs) + '</dd></div>' +
    '<div class="stat"><dt>Físico</dt><dd>' + nf(DADOS.resumo.fisico) + '</dd></div>' +
    '<div class="stat"><dt>Sistema</dt><dd>' + nf(DADOS.resumo.sistema) + '</dd></div>' +
    '<div class="stat"><dt>Diferença</dt><dd class="' + (DADOS.resumo.dif < 0 ? 'neg' : '') + '">' +
      (DADOS.resumo.dif > 0 ? '+' : '') + nf(DADOS.resumo.dif) + '</dd></div>' +
    '</dl>';
  h += '<div class="legend">' +
    '<span><i class="dot" style="background:var(--ok)"></i>Confere</span>' +
    '<span><i class="dot" style="background:var(--falta)"></i>Falta física</span>' +
    '<span><i class="dot" style="background:var(--sobra)"></i>Sobra física</span>' +
    '<span><i class="dot" style="background:var(--semcad)"></i>Sem cadastro</span>' +
    '</div>';

  h += '<div class="section-label no-print"><span>Etiquetas</span></div>';
  h += '<a class="btn btn-accent no-print" href="#/qr">Gerar QR Codes dos armários</a>';

  return h;
}

function viewArmario(n, termo) {
  var a = armario(n);
  if (!a) return '<div class="empty">Armário ' + esc(n) + ' não existe.</div>';

  var pecas = totalPecas(a);
  var h = '';

  h += '<a class="btn btn-ghost no-print" href="#/">&larr; Todos os armários</a>';

  h += '<div class="cab-head">' +
    '<div class="cab-badge">' + a.n + '</div>' +
    '<div class="cab-head-txt">' +
      '<h2>Armário</h2>' +
      '<p>' + nf(pecas) + ' ' + plural(pecas, 'peça', 'peças') + ' · ' + a.itens.length + ' ' + plural(a.itens.length, 'ref', 'refs') + '</p>' +
    '</div>' +
  '</div>';

  if (!a.itens.length) {
    h += '<div class="section-label"><span>Conteúdo</span></div>';
    h += '<div class="empty">Este armário está vazio no inventário de ' + esc(DADOS.gerado) + '.</div>';
    return h;
  }

  h += '<div class="conf-bar no-print">' +
    '<div class="search conf-search">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>' +
      '<input id="q" type="search" placeholder="Filtrar neste armário" value="' + esc(termo || '') + '" autocomplete="off">' +
      (termo ? '<button class="search-clear" id="qclear" aria-label="Limpar busca">&times;</button>' : '') +
    '</div>' +
    '<label class="switch"><input type="checkbox" id="confToggle"><span class="track"></span>Conferência</label>' +
  '</div>';

  var itens = filtra(a.itens.slice(), termo || '');
  if (!itens.length) {
    h += '<div class="empty" style="margin-top:18px">Nenhum item encontrado para <b>' + esc(termo) + '</b> neste armário.</div>';
    return h;
  }

  // agrupa por prateleira
  var prats = [];
  itens.forEach(function (it) { if (prats.indexOf(it.prat) === -1) prats.push(it.prat); });
  prats.sort(function (x, y) { return x - y; });

  prats.forEach(function (p) {
    var doShelf = itens.filter(function (it) { return it.prat === p; });
    var soma = doShelf.reduce(function (s, it) { return s + it.qtd; }, 0);
    h += '<section class="shelf">' +
      '<div class="shelf-head">' +
        '<span class="shelf-tag">Prateleira ' + p + '</span>' +
        '<span class="shelf-rule"></span>' +
        '<span class="shelf-count">' + nf(soma) + ' un</span>' +
      '</div>' +
      '<div class="items">';
    doShelf.forEach(function (it) {
      h += '<div class="item">' +
        '<div class="item-qtd">' + nf(it.qtd) + '<small>un</small></div>' +
        '<div>' +
          '<div class="item-desc">' + esc(it.desc) + '</div>' +
          '<div class="item-meta"><span class="ref">' + esc(it.ref) + '</span>' + pill(it.status) + '</div>' +
          '<div class="conf">' +
            '<span><i>sistema</i> ' + (it.sistema === null ? '—' : nf(it.sistema)) + '</span>' +
            '<span><i>diferença</i> ' + (it.dif === null ? '—' : (it.dif > 0 ? '+' : '') + nf(it.dif)) + '</span>' +
            (it.multi ? '<span><i>total da ref no armário</i> ' + nf(it.refTotal) + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    });
    h += '</div></section>';
  });

  return h;
}

/* localStorage pode ser bloqueado dentro de iframes com origem opaca */
function guarda(chave, valor) {
  try {
    if (valor === undefined) return localStorage.getItem(chave);
    localStorage.setItem(chave, valor);
  } catch (e) {}
  return null;
}

function baseUrl() {
  var salvo = guarda('disp_base');
  if (salvo) return salvo;
  return location.origin + location.pathname;
}

/* O endereço só serve para o QR se um celular conseguir abri-lo. */
function enderecoServe() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
  var h = location.hostname;
  if (!h || h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0') return false;
  if (location.origin === 'null') return false;
  return true;
}

function viewQR() {
  var base = baseUrl();
  var h = '';

  h += '<a class="btn btn-ghost no-print" href="#/">&larr; Todos os armários</a>';
  h += '<div class="section-label"><span>QR Codes dos armários</span></div>';

  h += '<div class="note no-print">' +
    (enderecoServe()
      ? '<b>Confira o endereço antes de imprimir.</b> É exatamente ele que vai dentro do QR Code. ' +
        'Precisa ser o endereço público da página — aquele que abre no celular, fora da sua conta.'
      : '<b>Este endereço não abre no celular.</b> A página está sendo vista de um arquivo local ' +
        'ou de um endereço interno. Cole abaixo o endereço público da página antes de imprimir as etiquetas.') +
    '</div>';

  h += '<div class="url-field no-print">' +
    '<label for="baseurl">Endereço da página</label>' +
    '<input id="baseurl" type="url" value="' + esc(base) + '" spellcheck="false" ' +
      'placeholder="https://…">' +
    '</div>';

  h += '<div class="conf-bar no-print" style="margin-bottom:16px">' +
    '<button class="btn btn-accent" id="printBtn">Imprimir etiquetas</button>' +
    '</div>';

  h += '<div class="qr-grid" id="qrgrid"></div>';
  return h;
}

function desenhaQR() {
  var grid = document.getElementById('qrgrid');
  if (!grid) return;
  var base = document.getElementById('baseurl').value.trim();
  var html = '';
  DADOS.armarios.forEach(function (a) {
    var url = base + '#/arm/' + a.n;
    var svg;
    try {
      svg = QR.toSvg(url);
    } catch (e) {
      svg = '<p class="qr-note">Endereço longo demais para gerar o QR.</p>';
    }
    var pecas = totalPecas(a);
    html += '<div class="qr-card">' +
      '<div class="qr-title">ARMÁRIO ' + a.n + '</div>' +
      svg +
      '<div class="qr-sub">Aponte a câmera</div>' +
      '<div class="qr-note">' + (pecas ? nf(pecas) + ' ' + plural(pecas, 'peça', 'peças') : 'vazio') +
        ' · ' + esc(DADOS.gerado) + '</div>' +
      '</div>';
  });
  grid.innerHTML = html;
}

/* ---------------- roteamento ---------------- */
function render() {
  var hash = location.hash.replace(/^#/, '') || '/';
  var partes = hash.split('?');
  var rota = partes[0];
  var termo = '';
  if (partes[1]) {
    var m = /(?:^|&)q=([^&]*)/.exec(partes[1]);
    if (m) termo = decodeURIComponent(m[1].replace(/\+/g, ' '));
  }

  var mArm = /^\/arm\/(\d+)$/.exec(rota);
  if (rota === '/qr') {
    app.innerHTML = viewQR();
    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
    var inp = document.getElementById('baseurl');
    var td;
    function atualiza() {
      guarda('disp_base', inp.value.trim());
      desenhaQR();
    }
    inp.addEventListener('input', function () {
      clearTimeout(td);
      td = setTimeout(atualiza, 250);
    });
    inp.addEventListener('change', atualiza);
    desenhaQR();
  } else if (mArm) {
    app.innerHTML = viewArmario(parseInt(mArm[1], 10), termo);
    ligaBusca(rota);
    ligaConferencia();
  } else {
    app.innerHTML = viewHome(termo);
    ligaBusca('/');
  }
  window.scrollTo(0, 0);
}

function ligaConferencia() {
  var tg = document.getElementById('confToggle');
  if (!tg) return;
  tg.checked = guarda('disp_conf') === '1';
  document.body.classList.toggle('show-conf', tg.checked);
  tg.addEventListener('change', function () {
    document.body.classList.toggle('show-conf', tg.checked);
    guarda('disp_conf', tg.checked ? '1' : '0');
  });
}

function ligaBusca(rota) {
  var q = document.getElementById('q');
  if (!q) return;
  var t;
  q.addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var v = q.value.trim();
      var novo = '#' + rota + (v ? '?q=' + encodeURIComponent(v) : '');
      history.replaceState(null, '', novo);
      var pos = q.selectionStart;
      renderMantendoFoco(rota, v, pos);
    }, 160);
  });
  var c = document.getElementById('qclear');
  if (c) c.addEventListener('click', function () { location.hash = '#' + rota; });
}

function renderMantendoFoco(rota, termo, pos) {
  var mArm = /^\/arm\/(\d+)$/.exec(rota);
  app.innerHTML = mArm ? viewArmario(parseInt(mArm[1], 10), termo) : viewHome(termo);
  ligaBusca(rota);
  ligaConferencia();
  var q = document.getElementById('q');
  if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
}

window.addEventListener('hashchange', render);
render();
</script>
